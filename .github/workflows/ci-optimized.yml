name: CI2

on:
  push:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # CACHE NUGET – przed restore
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('lab5/sample-ci/backend/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restore dependencies
        run: |
          cd lab5/sample-ci/backend/ProductApi
          dotnet restore
          cd ../ProductApi.Tests
          dotnet restore

      - name: Build
        run: |
          cd lab5/sample-ci/backend/ProductApi
          dotnet build --no-restore --configuration Release
          cd ../ProductApi.Tests
          dotnet build --no-restore --configuration Release

      - name: Test
        run: |
          cd lab5/sample-ci/backend/ProductApi.Tests
          dotnet test --no-build --configuration Release --logger trx

      - name: Publish
        run: |
          cd lab5/sample-ci/backend/ProductApi
          dotnet publish --no-build --configuration Release --output ./publish

      - name: Upload backend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: backend
          path: lab5/sample-ci/backend/ProductApi/publish

  frontend:
    name: Frontend (Node.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lab5/sample-ci/frontend/package-lock.json

      - name: Install dependencies
        working-directory: lab5/sample-ci/frontend
        run: npm ci

      - name: Test
        working-directory: lab5/sample-ci/frontend
        run: npm test

      - name: Build
        working-directory: lab5/sample-ci/frontend
        run: npm run build

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend
          path: lab5/sample-ci/frontend/dist
